<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layanan SMCC UNESA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container" id="chat-container">
        <header class="chat-header">
            <h1>Layanan SMCC UNESA</h1>
            <div class="header-actions">
                <select id="platform-select" class="platform-select-inline">
                    <option value="WA">WA POV</option>
                    <option value="IG">IG POV</option>
                </select>
                <a href="admin.html" class="btn-admin">Admin</a>
            </div>
        </header>
        
        <main class="chat-messages" id="chat-messages">
            <!-- Messages will be injected here by JS -->
        </main>
        
        <footer class="chat-input-area hidden" id="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Ketik pesan Anda..." autocomplete="off">
            <button id="send-btn" class="btn btn-primary">Kirim</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
